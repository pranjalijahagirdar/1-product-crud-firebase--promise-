<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product crud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <h1>Fetch Product crud (promise)</h1>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="card productCard">
                    <div class="card-body">
                        <form id="productForm">
                            <div class="form-group">
                                <label for="brandControl">Brand</label>
                                <input type="text" class="form-control" id="brandControl">
                            </div>
                            <div class="form-group">
                                <label for="categoryControl">Category</label>
                                <input type="text" class="form-control" id="categoryControl">
                            </div>
                            <div class="form-group">
                                <label for="priceControl">Price</label>
                                <input type="text" class="form-control" id="priceControl">
                            </div>
                            <div class="form-group">
                                <label for="titleControl">Title</label>
                                <input type="text" class="form-control" id="titleControl">
                            </div>
                            <button type="submit" class="btn btn-sm btn-block btn-primary" id="addproductBtn">Add Product</button>
                            <button type="button" class="btn btn-sm btn-block d-none btn-danger" id="updateproductBtn">Update Product</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="row">
                    <table class="table table-bordered productTable">
                        <thead>
                            <tr>
                                <th>Brand</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Title</th>
                                <th>Edit</th>
                                <th>Remove</th>
                            </tr>
                        </thead>
                        <tbody id="productList">
                            <!-- <tr>
                                <td>thh</td>
                                <td>rtu</td>
                                <td>567</td>
                                <td>yuuy</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-info" role="button">EDIT</button>
                                </td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-danger" role="button">REMOVE</button>
                                </td>
                            </tr> -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-dark" role="status">
  <span class="sr-only">Loading...</span>
</div>

    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
